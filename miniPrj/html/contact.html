<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body>
    <header>
        <!-- navigation bar -->
        <img src="../resources/logo.jpg" alt="Logo">
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./profile.html">Profile</a></li>
                <li><a href="./service.html">Service</a></li>
                <li><a href="#" class="current">Contact</a></li>
            </ul>
        </nav>
        <div class="searchDiv">
            <input type="search" id="searchBox" name="search" placeholder="Search....">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>
    <section class="contact">
        <h1>Contact</h1>
        <div class="contact-container">
            <!-- left side -->
            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p>
                    Feel free to contact us anytime.
                </p>
                <div class="info">
                    <i class="fa-solid fa-phone"></i><span>+959456789123</span>
                </div>
                <div class="info">
                    <i class="fa-solid fa-envelope"></i><span>phyuhninhmong@kbtc.edu.mm</span>
                </div>
                <div class="social">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
            <!-- right side -->
            <div class="contact-form">
                <form action="#">
                    <label for="fname">Full Name</label>
                    <input type="text" name="fnameBox" id="fname" placeholder="enter Full Name">
                    <label for="mail">Email</label>
                    <input type="email" id="mail" name="mailBox" placeholder="example@mail.com">
                    <label for="subject">Subject</label>
                    <textarea name="subjectBox" id="subject" placeholder="Write Your Message"></textarea>
                    <input type="submit" id="submit" name="submitBtn" value="Sent Message">
                </form>
            </div>

            <!-- google map -->
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3819.1114915709313!2d96.155379!3d16.820824200000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30c193e941f2e067%3A0x5e54c9aa66f073eb!2sKBTC%20University-%20School%20of%20IT!5e0!3m2!1sen!2smm!4v1784575927365!5m2!1sen!2smm"></iframe>

            </div>
            <!-- video -->
             <!-- <div class="video">
                <video src="../resources/tom.mp4" controls></video>
             </div> -->
        </div>
    </section>
    <footer>
        <p>
            Contact Me at <a href="mailto:charswife34@gmail.com">charswife34@gmail.com</a>
        </p>
    </footer>
</body>

</html>
