<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <ref rel="stylesheet" href="../css/simpleTable.css">
    <title>Simple Table</title>
</head>
<body>

    <h1>Simple Table</h1>
    
    <table border="3">
        <thead>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th colspan="2">Marks & Grade</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Su Su</td>
                <td>70</td>
                <td rowspan="2">A</td>
            </tr>
            
            <tr>
                <td>2</td>
                <td>Aung Aung</td>
                <td>72</td>
            </tr>
            
            <tr>
                <td>3</td>
                <td>Aye Aye</td>
                <td rowspan="2">65</td> 
                <td rowspan="2">B</td>
            </tr>

            <tr>
                <td>4</td>
                <td>Maung Maung</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Total Students : 4</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
