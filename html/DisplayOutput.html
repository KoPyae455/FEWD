<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Output</title>
    <!-- external js -->
    <script src="../js/DisplayOutput.js" type="text/javascript"></script>
    <link rel="stylesheet" href="../css/DisplayOutput.css">
</head>

<body>
    <h1>Display Output</h1>
    <!-- <button ondblclick="showConfirm()">Confirm</button> -->
    <button ondblclick="showPrompt()">Enter Name</button>
    <p id="nameOutput"></p>
    <button id="clickBtn">Click Me</button>

    <ul id="myList">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <button onclick="addItem()">Add new item</button>

    <p id="example" onmouseover="changeBackgroundColor()">
        This is the original text.
    </p>
    <button onclick="changeText()">
        Change Text
    </button>
    <div>
        <img src="../uploads/mario.jpg" alt="Dice" id="myImage">
        <br></br>
        <button onclick="changeImage()">Change Image</button>
    </div>
    <!-- internal script -->
    <script type="text/javascript">
        function showAlert() {
            alert("Hello World");
        }
        document.getElementById("clickBtn").addEventListener("click", showAlert);
    </script>
</body>

</html>
