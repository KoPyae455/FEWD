<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Output</title>
    <!-- external js -->
    <script src="../js/DisplayOutput.js" type="text/javascript"></script>
</head>

<body>
    <h1>Display Output</h1>
    <!-- <button ondblclick="showConfirm()">Confirm</button> -->
    <button ondblclick="showPrompt()">Enter Name</button>
    <p id="nameOutput"></p>
    <button id="clickBtn">Click Me</button>

    <ul id="myList">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <button onclick="addItem()">Add new item</button>

    <!-- internal script -->
    <!-- alert -->
    <script type="text/javascript">
        function showAlert() {
            alert("Hello World");
        }
        document.getElementById("clickBtn").addEventListener("click", showAlert);
    </script>
</body>

</html>
