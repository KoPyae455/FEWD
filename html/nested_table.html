<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Table</title>
    <link rel="stylesheet" href="../css/nested_table.css">
</head>

<body>

    <table class="parent">
        <thead>
            <tr>
                <th>No</th>
                <th>Customer Name</th>
                <th colspan="3">Bills</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Daw Hla</td>
                <td colspan="3">
                    <table class="child">
                        <tr>
                            <th>No</th>
                            <th>Fruit Name</th>
                            <th>QTY</th>
                            <th>Price</th>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>Apple</td>
                            <td>2</td>
                            <td rowspan="2">500</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Orange</td>
                            <td rowspan="2">1</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>Pineapple</td>
                            <td>700</td>
                        </tr>
                        <tr>
                            <td colspan="3">Total Amount</td>
                            <td>2200</td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>U Ba</td>
                <td id="nested-table" colspan="3">
                    <table class="child">
                        <tr>
                            <th>No</th>
                            <th>Name</th>
                            <th>QTY</th>
                            <th>Price</th>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>Milk</td>
                            <td>3</td>
                            <td>700</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Yogurt</td>
                            <td>2</td>
                            <td>900</td>
                        </tr>
                        <tr>
                            <td colspan="3">Total Amount</td>
                            <td>3900</td>
                        </tr>
                    </table>
                </td>
            </tr>

            <tr>
                <td>3</td>
                <td>Aye Aye</td>
                <td colspan="3">
                    <table class="child">
                        <tr>
                            <th>No</th>
                            <th>Name</th>
                            <th>QTY</th>
                            <th>Price</th>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>Spicy Noodle</td>
                            <td>2</td>
                            <td rowspan="2">600</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Tomyum Noodle</td>
                            <td>4</td>
                        </tr>
                        <tr>
                            <td colspan="3">Total Amount</td>
                            <td>3600</td>
                        </tr>

                    </table>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"></td>
                <td id="footcell">
                    <a href="./sampleSurveyForm.html" target="_self">
                        <!-- <button>Go To Survey</button> -->
                        <img src="../uploads/images.png" alt="back" width="50px" height="50px">
                    </a>
                </td>
            </tr>
    </table>
    </tfoot>
</body>

</html>
