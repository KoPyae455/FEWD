<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="../css/survey_form.css">
</head>
<body>
    <h2>FreeCodeCamp Survey Form</h2> 
    <h3>Thank you for taking the time to help us improve the platform</h3>
    
    <form action="#">
            <label>Name</label>
            <br>
            <input type="text" placeholder="   Enter your name" required>
            <br>

            <label>Email</label>
            <br>
            <input type="email" placeholder="   Enter your email">
            <br>
            
            <label>Age (optional)</label>
            <br>
            <input type="number" placeholder="   Age">
            <br>
            
            <label>Which option best describe your current role?</label>
            <br>
            <select name="role" id="role">
                <option value="student">Student</option>
                <option value="job">Full Time Job</option>
                <option value="administrator">Administrator</option>
                <option value="other">Other</option>
                <option value="select" selected disabled>   Select Current Role</option>
            </select>
            <br>

            <label>Would you recommend freeCodeCamp to a friend?</label>
            <br>
            <label><input type="radio" name="recommend" value="def">Definitely</label>
            <br>
            <label><input type="radio" name="recommend" value="may">May be</label>
            <br>
            <label><input type="radio" name="recommend" value="sure">Sure</label>
            <br>

            <label>What is your favorite feature of freeCodeCamp?</label>
            <br>
            <select name="feature" id="feature">
                <option value="java">JavaScript Algorithms and Data Structures</option>
                <option value="frontend">Front End Development Libraries</option>
                <option value="data">Data Visualization</option>
                <option value="challenges">Challenges</option>
                <option value="community">Open Source Community</option>
                <option value="project">Projects</option>
                <option value="select" selected disabled>   Select your favorite feature</option>
            </select>
            <br>

            <label>What would you like to see improved? (Check all that apply)</label>
            <br>
            <label><input type="checkbox" name="improved" value="Projects">Projects</label>
            <br>
            <label><input type="checkbox" name="improved" value="Backend">Back-end Projects</label>
            <br>
            <label><input type="checkbox" name="improved" value="Data">Data Visualization</label>
            <br>
            <label><input type="checkbox" name="improved" value="Challenges">Challenges</label>
            <br>
            <label><input type="checkbox" name="improved" value="OpenSource">Open Source Community</label>
            <br>
            <label><input type="checkbox" name="improved" value="Gitter">Gitter help rooms</label>
            <br>
            <label><input type="checkbox" name="improved" value="Videos">Videos</label>
            <br>
            <label><input type="checkbox" name="improved" value="Meetups">City Meetups</label>
            <br>
            <label><input type="checkbox" name="improved" value="Wiki">Wiki</label>
            <br>
            <label><input type="checkbox" name="improved" value="Forum">Forum</label>
            <br>
            <label><input type="checkbox" name="improved" value="Courses">Additional Courses</label>
            <br>

            <label>Any comments or suggestions?</label>
            <br>
            <textarea name="suggestion" id="suggestion" placeholder="   Enter your comment here..."></textarea>
            <br>

            <input type="submit" value="Submit">
    </form>
</body>
</html>
