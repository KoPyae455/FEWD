<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Exercise</title>
    <link rel="stylesheet" href="../css/form_ex.css">
</head>
<body>

    <form action="#" method="post">
        <fieldset>
            <h2>Student Form</h2>
            
            <label for="firstNameInput">First Name</label>
            <input type="text" id="firstNameInput" name="firstName" value="erfdfgfddfg">
            <br><br>

            <label for="lastNameInput">Last Name</label>
            <input type="text" id="lastNameInput" name="lastName" placeholder="Last Name Here">
            <br><br>

            <label>Gender</label>
            <input type="radio" name="gender" id="male" value="male"><label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female" checked><label for="female">Female</label>
            <br><br>

            <label>Subject of Interest<br>Biology</label>
            <input type="checkbox" name="subject" id="subMya" value="myanmar"><label for="subMya">Myanmar</label>
            <input type="checkbox" name="subject" id="subEng" value="english"><label for="subEng">English</label>
            <input type="checkbox" name="subject" id="subMath" value="mathematics" checked><label for="subMath">Mathematics</label>
            <input type="checkbox" name="subject" id="subPhy" value="physics"><label for="subPhy">Physics</label>
            <input type="checkbox" name="subject" id="subChem" value="chemistry"><label for="subChem">Chemistry</label>
            <br><br>

            <label>Language known</label>
            <input type="checkbox" name="language" id="langMya" value="myanmar"><label for="langMya">Myanmar</label>
            <input type="checkbox" name="language" id="langEng" value="english"><label for="langEng">English</label>
            <input type="checkbox" name="language" id="other" value="others" checked><label for="other">Others</label>
            <br><br>

            <label for="bodInput">Date of Birth</label>
            <input type="date" id="bodInput" name="bod" required>
            <br><br>

            <label for="contactInput">Contact Number</label>
            <input type="number" id="contactInput" name="contact" placeholder="09xxxxxxxxx">
            <br><br>

            <label for="addressInput">Address</label>
            <textarea name="address" id="addressInput" cols="50" rows="4" placeholder="No.(xx), xxx Block" required></textarea>
            <br><br>

            <label for="pinInput">PIN Code</label>
            <input type="text" id="pinInput" name="pin" placeholder="Enter PIN">
            <br><br>

            <label for="stateInput">State</label>
            <select id="stateInput" name="state">
                <option value="">Choose State</option>
                <option value="yangon">Yangon</option>
                <option value="mandalay">Mandalay</option>
            </select>
            <br><br>

            <input type="reset" class="btn" value="Reset">
            <input type="submit" class="btn" value="Submit">

        </fieldset>
    </form>

</body>
</html>
